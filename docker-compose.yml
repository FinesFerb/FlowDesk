services:
  postgres:
    image: postgres:18
    container_name: flowdesk-postgres
    environment:
      POSTGRES_DB: flowdesk
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
    ports:
      - "5433:5432"
    volumes:
      - flowdesk-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk -d flowdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowdesk-pg:
